{% extends "base.html" %}
{% block title %}Sign up{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Create account</h1>
  <form method="post">
    <label>Full name <input name="name" required></label>
    <label>Email <input type="email" name="email" required></label>
    <div class="row">
      <label>Age <input type="number" name="age" min="0" max="120" required></label>
      <label>Gender
        <select name="gender" required><option value="M">Male</option><option value="F">Female</option><option value="O">Other</option></select>
      </label>
    </div>
    <label>Phone <input name="phone" inputmode="tel" required></label>
    <label>Password (min 6 characters) <input type="password" name="password" minlength="6" required></label>
    <button class="btn" type="submit">Sign up</button>
  </form>
  <p class="muted">Already registered? <a href="{{ url_for('login') }}">Log in</a></p>
</section>
{% endblock %}
